<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="860" viewBox="0 0 1280 860">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <marker id="arrow-sync" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0f766e"/>
    </marker>
    <marker id="arrow-async" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7c3aed"/>
    </marker>
  </defs>

  <rect width="1280" height="860" fill="#f4f6f8"/>
  <text x="40" y="42" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#0f172a">Doctor Ri Clinic - System Architecture</text>
  <text x="40" y="64" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#64748b">Modular monolith  |  React PWA  |  Spring Boot  |  MySQL  |  Redis  |  Docker Compose</text>

  <!-- Actor -->
  <g transform="translate(48, 210)">
    <circle cx="36" cy="28" r="16" fill="none" stroke="#0f172a" stroke-width="3"/>
    <line x1="36" y1="44" x2="36" y2="92" stroke="#0f172a" stroke-width="3" stroke-linecap="round"/>
    <line x1="36" y1="58" x2="12" y2="82" stroke="#0f172a" stroke-width="3" stroke-linecap="round"/>
    <line x1="36" y1="58" x2="60" y2="82" stroke="#0f172a" stroke-width="3" stroke-linecap="round"/>
    <line x1="36" y1="92" x2="16" y2="132" stroke="#0f172a" stroke-width="3" stroke-linecap="round"/>
    <line x1="36" y1="92" x2="56" y2="132" stroke="#0f172a" stroke-width="3" stroke-linecap="round"/>
    <text x="36" y="158" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#0f172a">Actor</text>
    <text x="36" y="176" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#64748b">Patient / Staff</text>
  </g>

  <line x1="128" y1="268" x2="188" y2="268" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- API Gateway -->
  <g transform="translate(196, 214)">
    <rect width="200" height="112" rx="12" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
    <text x="16" y="28" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0c4a6e">API Gateway</text>
    <text x="16" y="48" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#0369a1">Nginx  |  React PWA</text>
    <text x="16" y="68" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#075985">serves UI  |  proxies /api to api</text>
    <rect x="16" y="80" width="58" height="20" rx="4" fill="#2496ed"/>
    <text x="45" y="94" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10" font-weight="700" fill="#ffffff">Docker</text>
    <rect x="80" y="80" width="44" height="20" rx="4" fill="#0f172a"/>
    <text x="102" y="94" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10" font-weight="700" fill="#ffffff">web</text>
  </g>

  <!-- Auth -->
  <g transform="translate(196, 88)">
    <rect width="200" height="96" rx="12" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
    <text x="16" y="26" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#4c1d95">Auth</text>
    <text x="16" y="46" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#6d28d9">JWT access + refresh</text>
    <text x="16" y="64" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#5b21b6">login  |  RBAC  |  SecurityConfig</text>
    <rect x="16" y="72" width="58" height="18" rx="4" fill="#2496ed"/>
    <text x="45" y="85" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10" font-weight="700" fill="#ffffff">Docker</text>
  </g>

  <line x1="296" y1="184" x2="296" y2="212" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="304" y="204" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10" fill="#7c3aed">check token</text>
  <line x1="396" y1="268" x2="454" y2="268" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Monolith cluster -->
  <rect x="456" y="80" width="788" height="548" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="476" y="104" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#334155">Spring Boot modular monolith  |  be-doc-doctor-ri  |  one process, many modules</text>

  <!-- Catalog -->
  <g transform="translate(476, 124)">
    <rect width="220" height="168" rx="12" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
    <text x="16" y="28" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#065f46">Catalog Service</text>
    <text x="16" y="48" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#047857">services  |  doctors  |  schedules</text>
    <text x="16" y="66" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#047857">GET /services  GET /doctors</text>
    <g transform="translate(16, 84)">
      <ellipse cx="44" cy="12" rx="44" ry="11" fill="#00758f"/>
      <rect x="0" y="12" width="88" height="26" fill="#00758f"/>
      <ellipse cx="44" cy="38" rx="44" ry="11" fill="#005f73"/>
      <text x="44" y="30" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#ffffff">MySQL</text>
    </g>
    <rect x="16" y="140" width="58" height="18" rx="4" fill="#2496ed"/>
    <text x="45" y="153" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10" font-weight="700" fill="#ffffff">Docker</text>
  </g>

  <!-- Appointment -->
  <g transform="translate(724, 124)">
    <rect width="240" height="168" rx="12" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/>
    <text x="16" y="28" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#9a3412">Appointment Service</text>
    <text x="16" y="48" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#c2410c">book  |  cancel  |  reschedule</text>
    <text x="16" y="66" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#c2410c">POST /appointments  |  idempotency</text>
    <g transform="translate(16, 84)">
      <ellipse cx="40" cy="12" rx="40" ry="10" fill="#00758f"/>
      <rect x="0" y="12" width="80" height="24" fill="#00758f"/>
      <ellipse cx="40" cy="36" rx="40" ry="10" fill="#005f73"/>
      <text x="40" y="28" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10" font-weight="700" fill="#ffffff">MySQL</text>
    </g>
    <g transform="translate(112, 84)">
      <ellipse cx="40" cy="12" rx="40" ry="10" fill="#dc382d"/>
      <rect x="0" y="12" width="80" height="24" fill="#dc382d"/>
      <ellipse cx="40" cy="36" rx="40" ry="10" fill="#a41e11"/>
      <text x="40" y="28" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10" font-weight="700" fill="#ffffff">Redis</text>
    </g>
    <rect x="16" y="140" width="58" height="18" rx="4" fill="#2496ed"/>
    <text x="45" y="153" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10" font-weight="700" fill="#ffffff">Docker</text>
    <text x="84" y="153" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10" fill="#9a3412">slot hold 5 min</text>
  </g>

  <!-- Resource -->
  <g transform="translate(476, 360)">
    <rect width="220" height="168" rx="12" fill="#f0fdfa" stroke="#0d9488" stroke-width="1.5"/>
    <text x="16" y="28" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#115e59">Resource Service</text>
    <text x="16" y="48" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#0f766e">slots  |  rooms  |  machines</text>
    <text x="16" y="66" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#0f766e">must be free before booking</text>
    <g transform="translate(16, 84)">
      <ellipse cx="44" cy="12" rx="44" ry="11" fill="#00758f"/>
      <rect x="0" y="12" width="88" height="26" fill="#00758f"/>
      <ellipse cx="44" cy="38" rx="44" ry="11" fill="#005f73"/>
      <text x="44" y="30" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#ffffff">MySQL</text>
    </g>
    <rect x="16" y="140" width="58" height="18" rx="4" fill="#2496ed"/>
    <text x="45" y="153" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10" font-weight="700" fill="#ffffff">Docker</text>
  </g>

  <!-- Clinic Queue -->
  <g transform="translate(724, 360)">
    <rect width="240" height="168" rx="12" fill="#fefce8" stroke="#ca8a04" stroke-width="1.5"/>
    <text x="16" y="28" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#854d0e">Clinic Queue</text>
    <text x="16" y="48" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#a16207">check-in  |  call  |  encounter</text>
    <text x="16" y="66" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#a16207">appointment != queue != exam</text>
    <g transform="translate(16, 84)">
      <ellipse cx="44" cy="12" rx="44" ry="11" fill="#00758f"/>
      <rect x="0" y="12" width="88" height="26" fill="#00758f"/>
      <ellipse cx="44" cy="38" rx="44" ry="11" fill="#005f73"/>
      <text x="44" y="30" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#ffffff">MySQL</text>
    </g>
    <rect x="16" y="140" width="58" height="18" rx="4" fill="#2496ed"/>
    <text x="45" y="153" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10" font-weight="700" fill="#ffffff">Docker</text>
  </g>

  <!-- Outbox -->
  <g transform="translate(992, 124)">
    <rect width="228" height="100" rx="12" fill="#1e293b"/>
    <text x="16" y="28" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#ffffff">Outbox</text>
    <text x="16" y="48" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#cbd5e1">outbox_events table</text>
    <text x="16" y="68" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#94a3b8">same DB transaction as booking</text>
    <text x="16" y="86" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#a78bfa">async message pipe</text>
  </g>

  <!-- Notification -->
  <g transform="translate(992, 360)">
    <rect width="228" height="168" rx="12" fill="#fdf2f8" stroke="#db2777" stroke-width="1.5"/>
    <text x="16" y="28" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#9d174d">Notification Service</text>
    <text x="16" y="48" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#be185d">worker polls outbox</text>
    <text x="16" y="66" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#be185d">EMAIL  |  PUSH  |  in-app inbox</text>
    <text x="16" y="88" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#9d174d">reminders 24h and 2h before</text>
    <rect x="16" y="140" width="58" height="18" rx="4" fill="#2496ed"/>
    <text x="45" y="153" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10" font-weight="700" fill="#ffffff">Docker</text>
    <rect x="80" y="140" width="52" height="18" rx="4" fill="#9d174d"/>
    <text x="106" y="153" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10" font-weight="700" fill="#ffffff">email</text>
  </g>

  <!-- Sync arrows -->
  <path d="M 620 292 L 620 352" fill="none" stroke="#0f766e" stroke-width="2.5" marker-end="url(#arrow-sync)"/>
  <rect x="528" y="308" width="84" height="20" rx="4" fill="#ccfbf1"/>
  <text x="570" y="322" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#0f766e">SYNC</text>

  <path d="M 844 292 L 844 352" fill="none" stroke="#0f766e" stroke-width="2.5" marker-end="url(#arrow-sync)"/>
  <rect x="848" y="308" width="96" height="20" rx="4" fill="#ccfbf1"/>
  <text x="896" y="322" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10" font-weight="700" fill="#0f766e">day-of ops</text>

  <!-- Async arrows -->
  <path d="M 964 180 L 990 180" fill="none" stroke="#7c3aed" stroke-width="2.5" stroke-dasharray="6 4" marker-end="url(#arrow-async)"/>
  <rect x="968" y="152" width="56" height="20" rx="4" fill="#ede9fe"/>
  <text x="996" y="166" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#6d28d9">ASYNC</text>
  <path d="M 1106 224 L 1106 352" fill="none" stroke="#7c3aed" stroke-width="2.5" stroke-dasharray="6 4" marker-end="url(#arrow-async)"/>

  <!-- Compose bar -->
  <g transform="translate(40, 656)">
    <rect width="780" height="88" rx="12" fill="#0f172a"/>
    <text x="20" y="28" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#ffffff">Docker Compose  |  deploy/docker-compose.yml</text>
    <rect x="20" y="44" width="170" height="28" rx="6" fill="#2496ed"/>
    <text x="105" y="62" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#ffffff">web :8088 Nginx+FE</text>
    <rect x="202" y="44" width="170" height="28" rx="6" fill="#2496ed"/>
    <text x="287" y="62" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#ffffff">api :8080 Spring</text>
    <rect x="384" y="44" width="170" height="28" rx="6" fill="#00758f"/>
    <text x="469" y="62" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#ffffff">mysql :3307</text>
    <rect x="566" y="44" width="170" height="28" rx="6" fill="#dc382d"/>
    <text x="651" y="62" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#ffffff">redis :6380</text>
  </g>

  <!-- Observability -->
  <g transform="translate(840, 656)">
    <rect width="404" height="88" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="16" y="26" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#0f172a">Observability</text>
    <text x="16" y="48" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#475569">Spring Actuator  |  GET /actuator/health</text>
    <text x="16" y="70" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#64748b">Compose healthchecks keep mysql, redis, api up</text>
  </g>

  <!-- Legend -->
  <rect x="40" y="770" width="36" height="4" fill="#0f766e"/>
  <text x="84" y="776" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#334155">SYNC - caller waits (slot / room / machine must be free)</text>
  <line x1="560" y1="772" x2="596" y2="772" stroke="#7c3aed" stroke-width="3" stroke-dasharray="6 4"/>
  <text x="604" y="776" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#334155">ASYNC - fire and forget (email must not block booking)</text>
  <text x="40" y="832" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#94a3b8">Modules live in one JVM today. Notification is the first candidate to split out later. Cloud: Vercel (FE) + Railway (API, MySQL, Redis).</text>
</svg>
