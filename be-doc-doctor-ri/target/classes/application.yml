spring:
  application:
    name: doctor-ri-clinic
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3306}/${MYSQL_SCHEMA:db_clinic}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh
    username: ${MYSQL_ROOT_USERNAME:root}
    password: ${MYSQL_ROOT_PASSWORD:123456}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      minimum-idle: 0
      maximum-pool-size: 5
  data:
    redis:
      timeout: 60000
      database: 0
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      username: ${REDIS_USERNAME:}
      password: ${REDIS_PASSWORD:}
  mail:
    host: ${MAIL_HOST:127.0.0.1}
    port: ${MAIL_PORT:1025}
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Ho_Chi_Minh
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: ${PORT:${SERVER_PORT:8080}}

management:
  endpoints:
    web:
      exposure:
        include: health,info

doctorri:
  booking:
    hold-minutes: 5
    window-days: 30
    free-cancel-hours: 24
    late-grace-minutes: 15
  jwt:
    secret: ${JWT_SECRET:doctor-ri-clinic-dev-secret-change-me-32bytes!!}
    access-token-minutes: 120
    refresh-token-days: 14
  notification:
    channels: EMAIL,PUSH
    from-email: noreply@doctorri.local
    reminder-hours: 24,2
  push:
    provider: ${PUSH_PROVIDER:STUB}
    fcm-credentials-path: ${FCM_CREDENTIALS_PATH:}
    fcm-project-id: ${FCM_PROJECT_ID:}
  cors:
    # Comma-separated. Use patterns like https://*.vercel.app for previews.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://doctorri.local}

logging:
  level:
    com.doctorri.clinic: INFO
